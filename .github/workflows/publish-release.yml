name: Publish Atlas beta

on:
  push:
    branches: [main]
    paths: ['src/Atlas.App/Atlas.App.csproj']
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 0.19.22"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and package Atlas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VERSION = $env:RELEASE_VERSION -creplace '^v', ''
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            [xml]$project = Get-Content src/Atlas.App/Atlas.App.csproj -Raw
            $env:VERSION = [string]($project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText)
          }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Enter a version such as 0.19.22.'
          }

          dotnet publish src/Atlas.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            "-p:Version=$env:VERSION" -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "VERSION=$env:VERSION" >> $env:GITHUB_ENV
          Copy-Item LICENSE publish/LICENSE.txt
          Copy-Item docs/third-party/*.txt publish
          $zip = "Atlas-Collection-Manager-v$env:VERSION-win-x64.zip"
          Compress-Archive -Path publish/AtlasCollectionManager.exe,publish/*.txt -DestinationPath $zip

      - name: Publish GitHub prerelease
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $zip = "Atlas-Collection-Manager-$tag-win-x64.zip"
          gh release create $tag $zip --target $env:GITHUB_SHA --prerelease `
            --title "Atlas Collection Manager $tag Beta" `
            --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
